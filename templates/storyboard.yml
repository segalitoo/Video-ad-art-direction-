# storyboard.yml · stage 3 output
# The shot list. scripts/assemble.py turns it into prompts,
# scripts/matrix.py turns its variants into the ad matrix.
# Copy this file next to the lock, fill it in, then run:
#   python scripts/assemble.py <this file> --check

ad:
  id: <brand>-<concept>-15s
  lock: <brand>.dna.yml          # path relative to this file
  length_s: 15
  master_aspect: "9:16"          # generate once in this ratio, reframe the rest
  platforms: [tiktok, meta_vertical, youtube_shorts, meta_feed]
  tools: [higgsfield, nano-banana, google-flow-veo, kling]

# Beats: hook | build | product | proof | payoff | end-card
# The hook shot must land inside the first 2 seconds, with sound off.
shots:
  - id: S01
    beat: hook
    duration_s: 1.5
    subject: <what is in the frame, one sentence; this fills the [SHOT] slot>
    action: <what moves, and how; this becomes the motion prompt>
    camera_move: <static | slow push-in | orbit | whip pan | handheld follow>
    hero: false                  # true = attach the hero reference image
    super: <on-screen text, from the copy matrix>
    sound: <music cue, for the edit>
    sfx: <what the viewer hears in this shot; goes into the motion prompt>
    vo: ""                       # voiceover line, if any
    generate: true               # false = built by hand (end card, type)

  - id: S99
    beat: end-card
    duration_s: 2
    subject: logo and CTA on the hero colour
    generate: false
    super: <CTA line>

# Static ads (optional). Plates are generated with empty space where the headline goes;
# scripts/static_compose.py sets headline, CTA and wordmark and sizes every platform.
statics:
  - id: A1
    concept: <one line>
    subject: <the frozen image, like a keyframe subject>
    hero: true
    copy_space: top            # top | bottom: where the headline sits
    headline: "<max 7 words, 40 characters>"
    cta: "<CTA>"
    plates: ["4:5", "9:16"]    # ratios to generate; other sizes are cut from the nearest one
    platforms: [meta_feed, meta_vertical]

# The ad matrix. One approved base, many variants.
# Quote every line: a comma inside {...} breaks YAML.
variants:
  hooks:
    - {id: H1, super: "<hook line 1>"}
    - {id: H2, super: "<hook line 2>"}
  ctas:
    - {id: C1, text: "<CTA 1>"}
