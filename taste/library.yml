- id: T0021
  kind: exemplar
  medium: web
  file: refs/external/T0021.jpg
  original: 25.webp
  tags:
  - vertical-fintech
  - landing-page
  - concept
  - three-colour-system
  - accent-cta
  - iridescent-product
  - big-type
  - dark-field
  why: 'A strict three-colour system: black, off-white and one acid lime used only for CTAs. All other colour is
    saved for the product, the iridescent cards. A huge, tightly tracked sans headline beside a small grey paragraph
    gives two sizes and a clear order. The black panel bends around the ''Explore more'' badge, so the layout itself
    points down the page.'
  source: Dribbble shot 19742791, 'Carty – Digital Banking Landing Page Website' (https://dribbble.com/shots/19742791).
    Designer not visible in the screenshots. Concept work, not a live product. Screenshots by the art director,
    2026-09-27.
  added: '2026-09-27'
  by: 'art director (verdict: good); claude (reason, draft)'
  external: true
  copy: Digitize your financial / Money should be easy. It's time to say goodbye to banks & financial services companies
    that don't work for you / Digitize Now / 12M World active user / 2022 The world's best digital banks
  watch: Grey-on-grey feature cards and stat labels are too faint to read. The headline 'Digitize your financial'
    is broken English.
