- id: T0015
  kind: exemplar
  medium: static
  file: refs/external/T0015.jpg
  original: rosie-strip.png
  tags:
  - carousel
  - story-arc
  - sequence
  - saas
  - highlight-word
  - ui-fragments
  why: 'A five-card carousel with a story: the problem, what it costs, the wrong fix, the product, the promise.
