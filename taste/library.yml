- id: T0007
  kind: exemplar
  medium: static
  file: refs/external/T0007.jpg
  original: fleava-dark.png
  tags:
  - offer
  - proof
  - hand-holds-product
  - dark-field
  - type-column
  - dtc
  why: 'An offer ad in three steps: a promise headline, three short facts, then the offer in bold. The hand holds
    the bottle at the corner, so the type column stays on a clean dark field. Stars and a review count replace a
    long testimonial.'
  source: Fleava. Screenshot shared by the art director, 2026-09-27; original source not given
  added: '2026-09-27'
  by: claude (draft, art director to confirm)
  external: true
  copy: FLEAVA / Finally, hair regrowth that doesn't shed first. / No shedding phase. No side effects. Applied in
    60 seconds. / Get 60% OFF + 4 free gift / Try it risk-free / 4,800+ Reviews
  watch: The small outlined 'Try it risk-free' button is weak for the only CTA.
- id: T0008
  kind: exemplar
  medium: static
  file: refs/external/T0008.jpg
  original: fleava-notes.png
  tags:
  - native-format
  - notes-app
  - ugc
  - callout-arrows
  - dense-copy
  - dtc
  why: 'A native format: it looks like an iPhone Notes page, so it reads as a person''s note, not an ad. Emoji bullets
    and hand-drawn arrows fit that voice. The long copy works because the frame makes long text feel normal.'
  source: Fleava. Screenshot shared by the art director, 2026-09-27; original source not given
  added: '2026-09-27'
  by: claude (draft, art director to confirm)
  external: true
  copy: How I stopped my thinning at the root cause... / Copper peptides clinically shown to reactivate dormant
    follicles. / Works at the follicle level, not just the surface. / Most users see baby hairs in 60-90 days. /
    No shedding phase. No side effects. Nothing to lose. / 90 Day Money Back Guarantee
  watch: The bottle is a clean studio render, which breaks the 'my own note' illusion a little.
- id: T0009
  kind: exemplar
  medium: static
  file: refs/external/T0009.jpg
  original: viko-arctic.png
  tags:
  - visual-metaphor
  - composite
  - logo-only
  - no-headline
  why: 'One visual metaphor carries the whole ad: the air conditioner sinks into arctic water under a polar bear,
    so ''cold'' is shown, not said. The only text is the logo.'
  source: 'Vikoclima (likely a portfolio concept: the set uses a placeholder phone number). Screenshot shared by
    the art director, 2026-09-27; original source not given'
  added: '2026-09-27'
  by: claude (draft, art director to confirm)
  external: true
  copy: VIKOCLIMA / Системи за климатизация (air-conditioning systems)
  watch: Visible composite seams; the logo is bigger than the idea needs.
- id: T0010
  kind: exemplar
  medium: static
  file: refs/external/T0010.jpg
  original: viko-set.png
  tags:
  - campaign-set
  - visual-metaphor
  - dense-copy
  why: 'Three posters, three metaphors for one product: a glass dome over the family (protection), arctic water
    (cold), a woman floating on clouds (comfort). Learn the one-metaphor-per-card idea.'
