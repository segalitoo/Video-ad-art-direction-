  why: 'One feature per callout: small sentence-case type on a clean white field, a hand-drawn arrow to the part
    it names, text never over the product. The mascot adds warmth without competing.'
  source: Meta Ad Library, ad 1188243682182438, Toetots (running since 2024-07-03 on Facebook, Instagram, Audience
    Network, Messenger). Screenshots by the art director.
  added: '2026-09-27'
  by: claude (draft, art director to confirm)
  external: true
  copy: Adjustable velcro strap / Barefoot Feel for All-Day Comfort / wordmark bottom centre
