entries:
- id: T0001
  kind: exemplar
  medium: static
  file: refs/external/T0001.jpg
  original: carousel-strip.png
  tags:
  - carousel
  - sequence
  - continuity
  - kids
  - ecommerce
  - product-cutout
  why: 'The carousel reads as one long strip: cream circles and the kite drawing cross the card edges, so each swipe
    feels like the next frame. The same idea as our chain rule for video.'
  source: Meta Ad Library, ad 1188243682182438, Toetots (running since 2024-07-03 on Facebook, Instagram, Audience
    Network, Messenger). Screenshots by the art director.
  added: '2026-09-27'
  by: claude (draft, art director to confirm)
  external: true
  copy: 'Primary text: Give your child''s feet the best start with Palette Baby Sneaker, recommended by experts
    and approved by podiatrists. Designed with your child''s health and comfort in mind, these sneakers are perfect
    for growing feet. #Toetots #ToetotsKids #babyshoes #Kidshoes. CTA: Shop Now.'
