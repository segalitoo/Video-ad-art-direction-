# Sunpeel · "Peel back summer" · 15s · stage 3 output

ad:
  id: sunpeel-peelback-15s
  lock: sunpeel.dna.yml
  length_s: 15
  master_aspect: "9:16"
  platforms: [tiktok, meta_vertical, youtube_shorts, meta_feed]
  tools: [higgsfield, nano-banana, midjourney, google-flow-veo, kling, runway]

shots:
  - id: S01
    beat: hook
    duration_s: 1.5
    subject: a whole ripe orange spinning in mid-air against a blush sky
    action: the peel unzips itself in one clean spiral and the fruit bursts into a cloud of sparkling bubbles
    camera_move: slow push-in
    hero: false
    super: Peel back summer.
    sound: zip, then a fizz crack on the burst
    generate: true

  - id: S02
    beat: build
    duration_s: 3
    subject: a cloud of sparkling bubbles re-forming into a can above a terracotta rooftop ledge
    action: the can drops, lands on the ledge with a springy bounce, condensation beads roll down its side
    camera_move: follow the drop, settle into a low hero angle
    hero: true
    super: Zero sugar. All zing.
    sound: music kicks in on the landing
    generate: true

  - id: S03
    beat: product
    duration_s: 3
    subject: macro close-up of the top of the can and its ring pull
    action: the ring pull pops open by itself and a fine citrus mist sprays up, catching the sunlight
    camera_move: static macro
    hero: true
    sound: can crack and rising fizz (the sound signature)
    generate: true

  - id: S04
    beat: proof
    duration_s: 2.5
    subject: three cans in a row on the ledge, sunset orange, yuzu yellow and grapefruit pink, each with its fruit beside it
    action: each can hops once in turn, on the beat, left to right
    camera_move: slow lateral slide
    hero: false
    super: Blood orange. Yuzu. Grapefruit.
    sound: three claps on the hops
    generate: true

  - id: S05
    beat: payoff
    duration_s: 3
    subject: the can in the foreground on the rooftop at sunset, citrus trees and the soft skyline behind
    action: the sun dips, citrus leaves sway, bubbles drift upward like fireflies
    camera_move: slow orbit around the can
    hero: true
    super: Your summer, peeled.
    sound: music resolves
    generate: true

  - id: S99
    beat: end-card
    duration_s: 2
    subject: Sunpeel wordmark and CTA on sunset orange
    generate: false
    super: Find it cold near you.
    sound: fizz tail, sound logo

# Quote every line: a comma inside {...} breaks YAML.
variants:
  hooks:
    - {id: H1, super: "Peel back summer."}
    - {id: H2, super: "Soda, but make it summer."}
    - {id: H3, super: "Zero sugar. Full zing."}
  ctas:
    - {id: C1, text: "Find it cold near you."}
    - {id: C2, text: "Try the summer 3-pack."}
