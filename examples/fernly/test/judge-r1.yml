fixes:
- 'S01 shows a fern or pothos in all 5 frames: the plant is the narrator, so S01 must be the monstera. Set hero:
  true on S01 (storyboard bug).'
- 'Replace ''a few books and mugs around'' with a fixed set list in the lock: one pale oak shelf left with three
  paperbacks and one cream floral mug, a tall window right with linen curtains, honey oak floor. Nothing else.'
- 'Make every end frame (L) as an edit of its kept start frame (D) with Qwen Image 3 Edit: ''same photo, only the
  plant changes''. Same pot, props and light by construction.'
- 'Soul drew an Instagram Stories screen twice (D4, L2): ''phone video, vertical'' reads as a screenshot. Add image
  negatives: social media interface, app buttons, usernames.'
- 'Droopy is not droopy enough: ''most leaves hang limp, some yellowing edges, stems bending over the pot rim''.'
- No model gave the view from the soil, and every stream is gentle. Ask for 'a heavy gush of water' and accept a
  floor-level angle, or build S01 as an edit of the set frame.
- Qwen won every group on cleanliness and room match; Soul looks more like real phone footage but failed 2 of 12.
  Keep Qwen, plus its edit model.
