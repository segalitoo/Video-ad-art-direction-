<!doctype html><html lang=en><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1">
<title>Judge sheet</title>
<style>
:root{--bg:#f6f4ef;--fg:#1d1f1a;--muted:#6b6e64;--card:#fff;--best:#2f7d4f;--fail:#b3261e}
@media (prefers-color-scheme:dark){:root{--bg:#151613;--fg:#ecebe6;--muted:#9a9d92;--card:#22241f;--best:#6fcf97;--fail:#f2b8b5}}
body{margin:0;padding:24px 16px;background:var(--bg);color:var(--fg);font:15px/1.45 system-ui,sans-serif}
h1{font-size:20px;margin:0 0 4px} p{color:var(--muted);margin:0 0 16px} h2{font-size:16px;margin:24px 0 8px}
.row{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
figure{margin:0;background:var(--card);border-radius:8px;overflow:hidden;border:3px solid transparent}
figure.clip{grid-column:1/-1} figure.best{border-color:var(--best)} figure.fail{opacity:.55} figure.fail span{color:var(--fail)}
img{display:block;width:100%;background:#8883} figcaption{padding:6px 8px;font-size:13px}
figcaption span{float:right;font-weight:700} small{color:var(--muted)}
</style>
<h1>Fernly test, round 1</h1><p>Round score 55, regenerate. Best set: D5 + L5 + P5. Green border: the best set. Scores are advice; the art director picks.</p>
<section><h2>D · S05 start: droopy monstera</h2><div class=row><figure class="best"><a href="out/plant-droopy_5.qwen.jpg"><img src="out/plant-droopy_5.qwen.jpg" loading="lazy" alt="D5"></a><figcaption><b>D5</b> <span>69</span> qwen<br><small>Cleanest frame. Lower leaves wilted, top still perky, so it reads &#x27;unwell&#x27;, not &#x27;dying&#x27;. A little too polished for phone footage</small></figcaption></figure><figure class=""><a href="out/plant-droopy_3.soul.jpg"><img src="out/plant-droopy_3.soul.jpg" loading="lazy" alt="D3"></a><figcaption><b>D3</b> <span>62</span> soul<br><small>A few hanging leaves read slightly tired. Tangled stems at the base may morph</small></figcaption></figure><figure class=""><a href="out/plant-droopy_1.soul.jpg"><img src="out/plant-droopy_1.soul.jpg" loading="lazy" alt="D1"></a><figcaption><b>D1</b> <span>51</span> soul<br><small>Healthy plant, not droopy: misses the beat. Plant sits left, books cut off at the bottom right</small></figcaption></figure><figure class=""><a href="out/plant-droopy_2.soul.jpg"><img src="out/plant-droopy_2.soul.jpg" loading="lazy" alt="D2"></a><figcaption><b>D2</b> <span>45</span> soul<br><small>Healthy, not droopy. Odd black hook at the top left, garbled book titles, busy lower third</small></figcaption></figure><figure class="fail"><a href="out/plant-droopy_4.soul.jpg"><img src="out/plant-droopy_4.soul.jpg" loading="lazy" alt="D4"></a><figcaption><b>D4</b> <span>FAIL</span> soul<br><small>Instagram Stories interface and a username drawn into the image</small></figcaption></figure></div></section><section><h2>L · S05 end: lush monstera</h2><div class=row><figure class="best"><a href="out/plant-lush_5.qwen.jpg"><img src="out/plant-lush_5.qwen.jpg" loading="lazy" alt="L5"></a><figcaption><b>L5</b> <span>72</span> qwen<br><small>Upright and healthy, centred, calm top. Lusher than D5 but not dramatically so</small></figcaption></figure><figure class=""><a href="out/plant-lush_3.soul.jpg"><img src="out/plant-lush_3.soul.jpg" loading="lazy" alt="L3"></a><figcaption><b>L3</b> <span>67</span> soul<br><small>Most lush and glossy. Gibberish book titles, books and mugs crowd the lower third</small></figcaption></figure><figure class=""><a href="out/plant-lush_1.soul.jpg"><img src="out/plant-lush_1.soul.jpg" loading="lazy" alt="L1"></a><figcaption><b>L1</b> <span>66</span> soul<br><small>Lush, but it fills to the top edge and hides the pot; no room for captions</small></figcaption></figure><figure class=""><a href="out/plant-lush_4.soul.jpg"><img src="out/plant-lush_4.soul.jpg" loading="lazy" alt="L4"></a><figcaption><b>L4</b> <span>55</span> soul<br><small>Leaves spread in a messy fan; mugs and books crowd the lower third</small></figcaption></figure><figure class="fail"><a href="out/plant-lush_2.soul.jpg"><img src="out/plant-lush_2.soul.jpg" loading="lazy" alt="L2"></a><figcaption><b>L2</b> <span>FAIL</span> soul<br><small>Instagram Stories interface and a username drawn into the image</small></figcaption></figure></div></section><section><h2>P · S01: pour, from the soil</h2><div class=row><figure class="best"><a href="out/S01-pour_5.qwen.jpg"><img src="out/S01-pour_5.qwen.jpg" loading="lazy" alt="P5"></a><figcaption><b>P5</b> <span>62</span> qwen<br><small>A fern, not the monstera. Best light and matches D5&#x27;s room; stream too gentle to sell &#x27;drown&#x27;</small></figcaption></figure><figure class=""><a href="out/S01-pour_3.soul.jpg"><img src="out/S01-pour_3.soul.jpg" loading="lazy" alt="P3"></a><figcaption><b>P3</b> <span>56</span> soul<br><small>Not the monstera. Same yellow-curtain room as D3/L4; floor-level angle, not from the soil</small></figcaption></figure><figure class=""><a href="out/S01-pour_2.soul.jpg"><img src="out/S01-pour_2.soul.jpg" loading="lazy" alt="P2"></a><figcaption><b>P2</b> <span>53</span> soul<br><small>A pothos, not the monstera. Clean, but a thin stream: &#x27;watering&#x27;, not &#x27;drowning&#x27;</small></figcaption></figure><figure class=""><a href="out/S01-pour_1.soul.jpg"><img src="out/S01-pour_1.soul.jpg" loading="lazy" alt="P1"></a><figcaption><b>P1</b> <span>43</span> soul<br><small>A fern, not the monstera. Odd heap of soil in the foreground, cool light</small></figcaption></figure><figure class=""><a href="out/S01-pour_4.soul.jpg"><img src="out/S01-pour_4.soul.jpg" loading="lazy" alt="P4"></a><figcaption><b>P4</b> <span>42</span> soul<br><small>Not the monstera. Blue fabric at the left edge may be a person on the sofa; pot looks like plastic</small></figcaption></figure></div></section>
</html>
