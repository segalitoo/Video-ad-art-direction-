<!doctype html><html lang=en><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1">
<title>Judge sheet</title>
<style>
:root{--bg:#f6f4ef;--fg:#1d1f1a;--muted:#6b6e64;--card:#fff;--best:#2f7d4f;--fail:#b3261e}
@media (prefers-color-scheme:dark){:root{--bg:#151613;--fg:#ecebe6;--muted:#9a9d92;--card:#22241f;--best:#6fcf97;--fail:#f2b8b5}}
body{margin:0;padding:24px 16px;background:var(--bg);color:var(--fg);font:15px/1.45 system-ui,sans-serif}
h1{font-size:20px;margin:0 0 4px} p{color:var(--muted);margin:0 0 16px} h2{font-size:16px;margin:24px 0 8px}
.row{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
figure{margin:0;background:var(--card);border-radius:8px;overflow:hidden;border:3px solid transparent}
figure.clip{grid-column:1/-1} figure.best{border-color:var(--best)} figure.fail{opacity:.55} figure.fail span{color:var(--fail)}
img{display:block;width:100%;background:#8883} figcaption{padding:6px 8px;font-size:13px}
figcaption span{float:right;font-weight:700} small{color:var(--muted)}
</style>
<h1>Fernly test, round 2 clips</h1><p>Round score 75, usable, fix the listed issues. Best set: S05-1 + S01-1. Green border: the best set. Scores are advice; the art director picks.</p>
<section><h2>S05 · Wilting to lush, D1 to L1</h2><div class=row><figure class="best clip"><a href="r2/out/S05.seedance.strip.png"><img src="r2/out/S05.seedance.strip.png" loading="lazy" alt="S05-1"></a><figcaption><b>S05-1</b> <span>77</span> seedance<br><small>Clean time-lapse recovery: leaves lift, yellow turns green, room and pot hold. No melting. Soft at 480p</small></figcaption></figure></div></section><section><h2>S01 · Pour, from P2</h2><div class=row><figure class="best clip"><a href="r2/out/S01.seedance.strip.png"><img src="r2/out/S01.seedance.strip.png" loading="lazy" alt="S01-1"></a><figcaption><b>S01-1</b> <span>72</span> seedance<br><small>Rock steady and water pools on the soil, but a thin stream, not the heavy gush asked for; the can never tilts</small></figcaption></figure></div></section>
</html>
