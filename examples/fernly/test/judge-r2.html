<!doctype html><html lang=en><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1">
<title>Judge sheet</title>
<style>
:root{--bg:#f6f4ef;--fg:#1d1f1a;--muted:#6b6e64;--card:#fff;--best:#2f7d4f;--fail:#b3261e}
@media (prefers-color-scheme:dark){:root{--bg:#151613;--fg:#ecebe6;--muted:#9a9d92;--card:#22241f;--best:#6fcf97;--fail:#f2b8b5}}
body{margin:0;padding:24px 16px;background:var(--bg);color:var(--fg);font:15px/1.45 system-ui,sans-serif}
h1{font-size:20px;margin:0 0 4px} p{color:var(--muted);margin:0 0 16px} h2{font-size:16px;margin:24px 0 8px}
.row{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
figure{margin:0;background:var(--card);border-radius:8px;overflow:hidden;border:3px solid transparent}
figure.clip{grid-column:1/-1} figure.best{border-color:var(--best)} figure.fail{opacity:.55} figure.fail span{color:var(--fail)}
img{display:block;width:100%;background:#8883} figcaption{padding:6px 8px;font-size:13px}
figcaption span{float:right;font-weight:700} small{color:var(--muted)}
</style>
<h1>Fernly test, round 2 (lock v1.1)</h1><p>Round score 66, usable, fix the listed issues. Best set: D1 + L1 + P2. Green border: the best set. Scores are advice; the art director picks.</p>
<section><h2>D · S05 start: wilting monstera</h2><div class=row><figure class="best"><a href="r2/out/droopy_1.qwen.jpg"><img src="r2/out/droopy_1.qwen.jpg" loading="lazy" alt="D1"></a><figcaption><b>D1</b> <span>72</span> qwen<br><small>Clearly dying: stems hang over the rim, lower leaves yellow. Clean. Room reads a bit bare for phone footage</small></figcaption></figure><figure class=""><a href="r2/out/droopy_2.qwen.jpg"><img src="r2/out/droopy_2.qwen.jpg" loading="lazy" alt="D2"></a><figcaption><b>D2</b> <span>66</span> qwen<br><small>Strong wilt, but a stem trails to the floor into a dried clump that will likely morph</small></figcaption></figure><figure class=""><a href="r2/out/droopy_4.qwen.jpg"><img src="r2/out/droopy_4.qwen.jpg" loading="lazy" alt="D4"></a><figcaption><b>D4</b> <span>66</span> qwen<br><small>Centred and clean, but the upper leaves look healthy: reads &#x27;a bit sad&#x27;, not &#x27;dying&#x27;</small></figcaption></figure><figure class="fail"><a href="r2/out/droopy_3.qwen.jpg"><img src="r2/out/droopy_3.qwen.jpg" loading="lazy" alt="D3"></a><figcaption><b>D3</b> <span>FAIL</span> qwen<br><small>Broken hero: two terracotta pots stacked</small></figcaption></figure></div></section><section><h2>L · S05 end: lush, edited from D1</h2><div class=row><figure class="best"><a href="r2/out/lush_1.qwen-edit.jpg"><img src="r2/out/lush_1.qwen-edit.jpg" loading="lazy" alt="L1"></a><figcaption><b>L1</b> <span>77</span> qwen-edit<br><small>Same plant grown lush and upright; room identical to D1. Dry stems show at the soil</small></figcaption></figure><figure class=""><a href="r2/out/lush_2.qwen-edit.jpg"><img src="r2/out/lush_2.qwen-edit.jpg" loading="lazy" alt="L2"></a><figcaption><b>L2</b> <span>65</span> qwen-edit<br><small>Dense and healthy; one leaf crosses the curtain, brown roots at the base</small></figcaption></figure></div></section><section><h2>P · S01: pour</h2><div class=row><figure class="best"><a href="r2/out/pour_2.qwen.jpg"><img src="r2/out/pour_2.qwen.jpg" loading="lazy" alt="P2"></a><figcaption><b>P2</b> <span>62</span> qwen<br><small>Same as P1, can closer to the corner, stream into the leaves; pot looks smaller than in D1</small></figcaption></figure><figure class=""><a href="r2/out/pour_1.qwen.jpg"><img src="r2/out/pour_1.qwen.jpg" loading="lazy" alt="P1"></a><figcaption><b>P1</b> <span>62</span> qwen<br><small>The monstera now, same room. Eye level, not from the soil; thin stream reads &#x27;watering&#x27;, not &#x27;drowning&#x27;</small></figcaption></figure></div></section>
