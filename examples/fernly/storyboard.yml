# Fernly · "Plant reviews" · 15s · stage 3 output
# The plant reviews its human. Captions carry the joke; Arthur reads them.
# Every clip is steady; scripts/phone_look.py adds the handheld feel in the edit.

ad:
  id: fernly-reviews-15s
  lock: fernly.dna.yml
  length_s: 15
  master_aspect: "9:16"
  platforms: [tiktok, meta_vertical, youtube_shorts, meta_feed]
  tools: [higgsfield, figma-weave]
  candidates: {keyframe: 6, motion: 2, static: 4}

shots:
  - id: S01
    beat: hook
    duration_s: 2
    subject: a hand and forearm coming in from the right edge at waist height, holding a sunny yellow watering can with a plain open spout, no sprinkler head, tipped far over the pot, the spout just above the soil, a thick stream of water mid-air
    edit_of: S05-K-end        # the healthy plant on day one, in the same room (lock v1.2)
    action: a steady stream of water pours from the spout into the soil and pools on its surface, the outside of the pot stays clean
    camera_move: static
    hero: true
    super: "My human is trying to drown me."
    vo: "My human is trying to drown me."
    sound: none
    sfx: water pouring onto soil, close and loud
    generate: true

  - id: S02
    beat: build
    duration_s: 2.5
    subject: extreme close-up of dark wet potting soil filling most of the frame, a shallow puddle of water sitting on top, the pot's terracotta rim at the edge, the room far out of focus behind
    action: a single drop lands in the puddle and ripples outward
    camera_move: static macro
    hero: false
    super: "Day 3. Watered. Again. ★★☆☆☆"
    vo: "Day three. Watered. Again. Two stars."
    sound: none
    sfx: one water drip, quiet room
    generate: true

  - id: S03
    beat: build
    duration_s: 3
    subject: the monstera in its pot on the floor right against the window, harsh midday sun burning through the linen curtains, leaves bleached pale by the glare, seen from low down
    action: the glare slowly swells until the frame blows out to white
    camera_move: static
    hero: true
    super: "Moved into full sun. ★☆☆☆☆"
    vo: "Then my human moved me into the sun. One star."
    sound: none
    sfx: a faint summer hum, a fly buzzing past
    generate: true

  - id: S04
    beat: product
    duration_s: 3
    subject: close-up from above of a phone lying flat and face up on the pale oak shelf, the screen large, square to the camera and dark, the terracotta pot rim and one drooping monstera leaf at the edge of the frame
    action: the phone screen lights up softly
    camera_move: static
    hero: false
    super: "Then my human got Fernly."
    vo: "Then my human got Fernly."
    sound: none
    sfx: a soft notification chime
    note: the notification ("Water Monty in 3 days") is real UI, laid over the screen in the edit
    generate: true

  - id: S05
    beat: payoff
    duration_s: 2.5
    subject: the monstera wilting badly by the window, most leaves limp and hanging low, some with yellowing edges, stems bent over the pot rim, soft morning light
    end_subject: the monstera is now lush and upright, glossy healthy green leaves held high, no wilting or yellowing
    action: the leaves slowly lift and open until the plant stands tall
    camera_move: static
    hero: true
    super: "Finally. Someone who listens. ★★★★★"
    vo: "Finally. Someone who listens. Five stars."
    sound: lo-fi bed starts
    sfx: soft leaves rustling
    generate: true

  - id: S99
    beat: end-card
    duration_s: 2
    subject: fernly wordmark and CTA on fern green
    generate: false
    super: "Your plants will leave better reviews."

statics:
  - id: A1
    concept: the five-star plant
    subject: the lush monstera in its terracotta pot by the window, glossy leaves, soft morning light
    from_frame: S05-K-end     # the kept lush frame already leaves the top third empty
    hero: true
    copy_space: top
    headline: "Finally. Someone who listens. ★★★★★"
    cta: "Get Fernly free"
    plates: ["4:5", "9:16"]
    platforms: [meta_feed, meta_vertical, tiktok]

  - id: A2
    concept: the one-star plant
    subject: a sunny yellow watering can with a plain open spout standing on the floor right against the pot, much too close
    edit_of: S05-K            # the kept wilting frame, plus the culprit
    hero: true
    copy_space: top
    headline: "My human, before Fernly. ★☆☆☆☆"
    cta: "Get Fernly free"
    plates: ["4:5", "9:16"]
    platforms: [meta_feed, meta_vertical, tiktok]

# Quote every line: a comma inside {...} breaks YAML.
variants:
  hooks:
    - {id: H1, super: "My human is trying to drown me.", mechanic: confession}
    - {id: H2, super: "One star. Would not live here again.", mechanic: contrarian}
    - {id: H3, super: "Day 3 of being overwatered.", mechanic: curiosity}
  ctas:
    - {id: C1, text: "Get Fernly free"}
    - {id: C2, text: "Save your plants"}
