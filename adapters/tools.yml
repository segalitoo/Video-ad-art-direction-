# adapters/tools.yml
# One master prompt, many tools. scripts/assemble.py reads this file and
# rewrites each shot prompt into the form each tool expects.
#
# Add a tool: copy a block, set its fields, run assemble.py with --tools.
# Tools change fast. Fields marked `verify: true` were right at
# last_checked, not guaranteed now.
#
# Fields
#   role        image | video | audio
#   negative    param  -> appended as a parameter (see negative_param)
#               field  -> printed separately, for the tool's own negative field
#               inline -> appended as a positive "Keep it clean: no ..." sentence
#               none   -> dropped; the tool works better with positive wording only
#   aspect      param  -> appended with aspect_param
#               ui     -> set in the tool's interface, printed as a reminder
#   motion_prompt  true -> for image-to-video, send motion only, not the look.
#                  The keyframe already carries the look; repeating it fights it.

last_checked: 2026-09-25

# Which tool does what (decided 2026-09-25):
#   video model  Seedance 2.5 on either engine
#   figma-weave  keyframes, motion, saved workflows the art director can open
#   higgsfield   the cheaper route for Seedance, plus reframe/outpaint, Marketing Studio,
#                virality predictor, TikTok publishing
# Both run inside Claude. Either can do the whole job; the split is by strength.
#
# Access (checked 2026-09-25):
#   figma-weave  the MCP tools need a PAID Weave plan (app.weavy.ai); a free plan is refused
#   higgsfield   needs credits on the account; the free plan had 0.1 credits
# Per round, the credit counts differ a lot (see `models` below), but a Weave credit and
# a Higgsfield credit are not the same money. Compare plan prices before choosing.

tools:

  generic:
    role: any
    negative: inline
    aspect: ui
    notes: Fallback for any tool not listed.

  higgsfield:
    role: image+video
    negative: inline           # Seedance 2.5 has no negative field
    aspect: ui
    motion_prompt: true
    runs_in_claude: true
    clip_range: [4, 30]        # Seedance 2.5: any whole second from 4 to 30
    hero_reference: true       # Seedance omni_reference takes extra reference images
    audio_native: true         # Seedance makes SFX from the prompt; the storyboard's sound cue is added
    max_parallel: {video: 6, image: 8}   # Plus plan; submit batches no larger than this
    no_music_or_sfx_model: true          # generate_audio is speech only (checked 2026-09-26)
    cost_unit: Higgsfield credits
    usd_per_credit: 0.049      # Plus monthly: $49 for 1,000 credits (annual $39 = 0.039; Ultra annual 0.033)
    models:                    # get_cost quotes, 9:16, 4s clips, sound off
      image:       {name: Nano Banana Pro, id: nano_banana_pro, credits: 2}          # keyframes: best hero consistency
      image_draft: {name: GPT Image 2.5 medium 1K, id: gpt_image_2_5, credits: 0.5}  # stage 2 style frames
      image_alt:   {name: GPT Image 2.5 high 2K Sunburst, id: gpt_image_2_5, credits: 2.75}
      video:       {name: Seedance 2.5 720p, id: seedance_2_5, credits: 28, credits_per_s: 7, min_s: 4}
      video_1080:  {name: Seedance 2.5 1080p, id: seedance_2_5, credits: 48}
      video_draft: {name: Seedance 2.5 480p, id: seedance_2_5, credits: 12}
      video_alt:   {name: Kling 3.0 5s, id: kling3_0, credits: 8.75}
    image_params:              # passed to generate_image / generate_image_batch
      model: nano_banana_pro
      resolution: 2k           # same price as 1k
      aspect_ratio: "9:16"
      medias: "image_references = the hero reference (hero shots, after the H0 gate)"
    draft_params:
      model: gpt_image_2_5
      variant: flare
      quality: medium
      resolution: 1k
    video_params:              # passed to generate_video / generate_video_batch
      model: seedance_2_5
      mode: omni_reference
      duration: 4
      resolution: 720p
      aspect_ratio: "9:16"
      generate_audio: true     # same price with or without (checked); gives a SFX track the edit can keep or mute
      medias: "start_image = the kept keyframe; image_references = the hero reference (hero shots)"
    verify: true
    notes: >
      Connected to Claude as an MCP server. Check `balance` first; a free plan cannot
      generate. Video model: Seedance 2.5 (chosen 2026-09-25). Generate motion candidates
      at 720p, then upscale_video only the kept clip to 1080p: there is no seed, so
      re-rendering at a higher resolution would change the motion that was approved.
      On hero shots pass the hero reference as image_references next to the start frame;
      that is what holds the product on-model in motion. Also the tool for reframe and
      outpaint to 4:5 / 1:1, Marketing Studio, the virality predictor and TikTok publishing.
      Use generate_video_batch for the candidates, jobs_wait, then show_generation_by_ids.

  figma-weave:
    role: image+video
    negative_image: inline     # Nano Banana has no negative field
    negative_video: inline     # Seedance 2.5 has no negative field (Kling and Veo do)
    aspect: ui
    motion_prompt: true
    runs_in_claude: true
    clip_range: [4, 30]
    audio_native: true
    cost_unit: Weave credits
    usd_per_credit: 0.01125    # Professional: $45 for 4,000 credits (Starter $24 / 1,500 = 0.016; top-up $10 / 1,200)
    models:                    # quotes from weave_find_model; ids can change, look them up again
      image:       {name: Nano Banana Pro, id: af5a6789-c7af-4c46-9a42-70222654e55b, credits: 11}
      image_draft: {name: Nano Banana 2, id: bebebed5-50c1-4701-98b3-86929db21585, credits: 6}
      video:       {name: Seedance 2.5 image-to-video, id: cbe8b347-8c85-4e1a-b379-f96f48932f43, credits: 168}
      video_alt:   {name: Kling Video 2.5 Turbo Pro, id: wnfmbl8VwUCfX2a1XcdfDlone, credits: 35}
      video_sound: {name: Veo 3.1 image-to-video, id: fg6e8647-d90a-4bad-a845-69fdc102a14j, credits: 90}
    verify: true
    notes: >
      Figma Weave, connected to Claude through the Figma MCP server. Two ways in:
      weave_find_model + weave_run_model runs one model directly; weave_run_tool runs a
      saved Weave workflow. Build the lock as a saved workflow (prompt nodes from the
      tokens, the hero image as a reference node) so the art director can open and
      tweak it visually in Weave. Every run quotes its cost first and needs an explicit
      approval. Download outputs with the curl command the output call returns.
      Use Nano Banana 2 for drafts, Nano Banana Pro for finals, Seedance 2.5 for motion
      (the kept keyframe as First Frame, generate_audio on: same price). Kling is the cheaper
      fallback; Veo 3.1 when a shot needs native sound.

  nano-banana:
    role: image
    negative: inline
    aspect: ui
    notes: >
      Gemini image model, used in Google Flow and the Gemini app. Strong for
      keeping a hero consistent from reference images. Best for keyframes and
      for fixing one detail in a kept frame without regenerating it.

  midjourney:
    role: image+video
    negative: param
    negative_param: "--no {items}"
    aspect: param
    aspect_param: "--ar {w}:{h}"
    extra_params: "--raw"
    motion_prompt: true
    verify: true
    notes: >
      Use a style reference (--sref) from the approved hero keyframe to hold the
      look across shots. Animate a kept image from the web app; choose low
      motion for product shots, high motion for action.

  google-flow-veo:
    role: video
    negative: inline
    aspect: ui
    motion_prompt: true
    audio_native: true
    clip_s: 8
    verify: true
    notes: >
      Veo in Google Flow. Use "Frames to video" with the kept keyframe.
      Veo can generate sound: describe the SFX in the prompt, or say
      "no music" so the edit keeps control of the soundtrack.

  kling:
    role: video
    negative: field
    aspect: ui
    motion_prompt: true
    clip_s: [5, 10]
    verify: true
    notes: >
      Image-to-video with optional end frame. Start and end frames give the
      most control for product reveals. Paste the negative list in its own field.

  runway:
    role: video
    negative: none
    aspect: ui
    motion_prompt: true
    clip_s: [5, 10]
    verify: true
    notes: >
      Image-to-video. Runway's own guidance is to describe what you want, not
      what you don't, so the negative list is dropped for this tool.

  suno:
    role: audio
    negative: inline
    aspect: none
    notes: >
      Music bed from the lock's sound tokens. Ask for an instrumental with a
      set bar count and length close to the edit, then cut and finish by hand.

  elevenlabs:
    role: audio
    negative: none
    aspect: none
    notes: Voiceover and multi-language versions from the approved script.
