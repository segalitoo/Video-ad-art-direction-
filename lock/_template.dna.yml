# <brand>-<campaign>.dna.yml · v1.0
# owner: art director
#
# The lock. Written once, before the first generation.
# Every prompt is built from these tokens by scripts/assemble.py.
# Nothing is written freehand, so nothing drifts quietly.
#
# Change a token -> raise the version. Every clip in the iteration log
# records the lock version it was made with.

meta:
  brand: <Brand name>
  campaign: <Campaign name>
  version: "1.0"
  owner: <art director name>
  mode: 3d-stylized            # 3d-stylized | live-action | ugc | motion-graphics
  people: true                 # false = product only ("no people or body parts"); hands = one hand may enter, never a face
  audience: <one line: who, and what they care about>
  promise: <one line: the single thing the ad must say>

# Leave a token out to use the mode default from lock/modes/<mode>.yml.
tokens:
  STYLE:
  WORLD:        # where the ad lives: setting, time of day, season
  FORM:         # how the product and characters look
  LIGHT:
  GRADE:
  CAMERA:
  MOTION:
  TECH:

# 4 to 8 colours. The first one is the hero colour.
palette:
  - {hex: "#000000", name: <name>, role: hero}
  - {hex: "#000000", name: <name>, role: accent}
  - {hex: "#000000", name: <name>, role: background}

# On-screen text is added in the edit, never generated.
type:
  family: <font>
  weight: <weight>
  case: sentence            # sentence | upper
  max_words_per_super: 6
  min_size_pct_of_height: 3.5

# How the brand talks. Copy checks (scripts/copy_check.py) and the static formats read this.
verbal:
  voice: <one word + a line, e.g. "bold: short, sure, no hedging">
  headline_case: sentence     # sentence | upper | lower | title
  headline_pattern: statement # statement | question | fragment | stat-led
  headline_max_words: 8
  cta: [<Shop now>]           # the CTA wording the brand uses; the first is the default

# Proof that exists and may be shown. Leave a field empty when there is none: the proof
# formats (stat, review, testimonial, rating, badges) refuse to render without it, and
# numbers in on-screen copy that are not listed here are flagged. Never invent proof.
proof:
  rating: ""                  # e.g. "4.8"
  review_count: ""            # e.g. "10,000+"
  stats: []                   # [{value: "93%", claim: "felt more energy", source: "survey of 1,204 buyers, 2026"}]
  quotes: []                  # [{text: "...", name: "Dana R.", source: "Trustpilot, with permission"}]
  badges: []                  # e.g. [Vegan, Third-party tested]
  price_per_day: ""           # e.g. "$1.13/day", only if the price supports it exactly

# The single buyer from the brief, in their own words (research.md voice bank).
buyer:
  who: <one person, one sentence>
  pain: <their words>
  dream: <their words>
  objection: <their words>

# What the ads never do. The pre-checks flag these words in every line a viewer sees.
guardrails:
  never_say: []               # banned words or claims, e.g. ["cure", "guaranteed", "best in the world"]
  never_use: []               # off-brand colours, tones or devices, for the design review

sound:
  genre: <genre>
  bpm: <bpm>
  instruments: <instruments>
  voice: none               # none | voiceover | on-camera dialogue
  signature: <sound logo or recurring SFX>

end_card:
  duration_s: 2
  logo: <file or description>
  cta_style: <button, super, or both>

# Added to the mode's negative lists. `negative` goes into every prompt;
# `negative_image` only into stills, `negative_video` only into motion.
negative: []
negative_image: []
negative_video: []

# The recurring hero (product or character). Every shot that shows it
# uses the same reference image, uploaded once to each tool.
hero:
  description: <one line, exact; describe the label graphically, not by brand name>
  wordmark: ""              # e.g. "SUNPEEL": the only text allowed in frame, printed on the product
  reference: <path to the approved hero keyframe, set after stage 4>
